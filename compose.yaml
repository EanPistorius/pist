services:

  api:
    image: eanpistorius/pist-api:1.0.2
    ports:
      - 8000:8000
    depends_on:
      - db
  
  ui:
    image: eanpistorius/pist-ui:1.1.0
    ports:
      - 3001:3000


  
  db:
    image: postgres:16
    container_name: pist-db
    restart: always
    environment:
      POSTGRES_USER: pistorius_user
      POSTGRES_PASSWORD: Pistorius1234
      POSTGRES_DB: pistorius
    ports:
      - "5432:5432"
    volumes:
      - pist-db-data:/var/lib/postgresql/data

  proxy:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/nginx/html/:/usr/share/nginx/html/:ro
    depends_on:
      - api
      - ui

volumes:
  pist-db-data: {}


